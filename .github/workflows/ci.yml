name: CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  PACK: rigProject
  EXAMPLE: document

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Require private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::error::Missing secret RIGKIT_CI_TOKEN. Create a fine-grained PAT with Contents:read on rigkid/RigKit and the in-org pack remotes, then set it as an org or repo Actions secret named RIGKIT_CI_TOKEN."
            exit 1
          fi

      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Checkout RigKit host
        uses: actions/checkout@v4
        with:
          repository: rigkid/RigKit
          path: host
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN }}

      - name: Overlay pack under test
        run: |
          rm -rf "host/packs/${PACK}"
          cp -a pack "host/packs/${PACK}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Configure example
        working-directory: host
        run: >
          cmake -S "packs/${PACK}/examples/${EXAMPLE}"
          -B "packs/${PACK}/examples/${EXAMPLE}/build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build example
        working-directory: host
        run: cmake --build "packs/${PACK}/examples/${EXAMPLE}/build"
